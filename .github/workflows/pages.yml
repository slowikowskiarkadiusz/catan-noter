name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp build version and assemble site
        run: |
          V=${GITHUB_SHA::7}
          for f in index.html no-db/index.html; do
            sed -i "s/const BUILD = 'dev'/const BUILD = '$V'/; s/?v=dev/?v=$V/g" "$f"
          done
          mkdir -p site/no-db site/db
          # strona główna: wersja z bazą Cosmos DB
          cp index.html cosmos.js cosmos-config.js site/
          echo "$V" > site/version.txt
          # wersja bez bazy (localStorage) pod /no-db/
          cp no-db/index.html site/no-db/
          echo "$V" > site/no-db/version.txt
          # dawny adres /db/ przekierowuje na stronę główną
          printf '%s\n' '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=../"><script>location.replace("../")</script>' > site/db/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
